ackground:#ffffff14;border-color:var(--border);color:var(--muted)}.chip-match_result_reported{background:#37c98b24;border-color:#37c98b4d;color:#bfe8d6}.chip-team_dropped{background:#ef5f6b24;border-color:#ef5f6b4d;color:#ffc9ce}.amend-form{margin-top:8px;padding:8px;border:1px dashed var(--border);border-radius:8px;background:#a97bff0f}.amend-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.loading,.empty{color:var(--muted);font-size:13px}.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin-left:auto}@keyframes spin{to{transform:rotate(360deg)}}</style>
